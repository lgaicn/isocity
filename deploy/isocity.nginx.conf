# IsoCity static site (browser game + APK download)
# Place: /etc/nginx/sites-available/isocity
server {
    listen 80 default_server;
    # If you already have other sites using default_server on :80,
    # remove "default_server" above (or change the port) to avoid a conflict.
    server_name _;

    root /var/www/isocity;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Hashed build assets - long immutable cache
    location /_next/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Game sprite atlases (webp)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # APK direct download - always fresh
    location = /IsoCity-debug.apk {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
